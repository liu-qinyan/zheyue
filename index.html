/* 月归档：哪些月份在切片里有内容 */
const DIARY_MONTHS = (function(){
  const m = {};
  DIARY.forEach(function(e){
    if(e.del) return;
    const k = e.d.slice(0,4) + '-' + e.d.slice(5,7);
    (m[k] = m[k] || []).push(e.id);
  });
  return m;
})();

function normPath(p){
  p = String(p || '').trim();
  p = p.replace(/^#+/, '');
  p = p.replace(/^[a-zA-Z0-9_.\-]*:?\/\/[^\/]*/, '');   /* 允许玩家粘贴整条域名 */
  p = p.replace(/[?#].*$/, '');
  if(p === '') return '/';
  if(p.charAt(0) !== '/') p = '/' + p;
  p = p.replace(/\/{2,}/g, '/');
  if(!/\/[^\/]+\.[a-z0-9]+$/i.test(p)) p = p.replace(/\/?$/, '/');
  return p;
}

/* ===== js/40-photo.js ===== */
/* ============================================================
   《折页清》 — 程序化图片（Canvas 运行时合成）
   为什么不用 Base64：一张 1600×1200 的照片压到 30KB 也要
   1.2MB 的 Base64 文本，几十张就撑爆单文件；而且 Base64 一眼假。
   Canvas 合成是确定性的（固定种子），离线可用，代码只占几十 KB。
   所有图片内容均为程序化生成的抽象画面，不含任何真实照片或真人。
   ============================================================ */

/* 固定种子随机（mulberry32）：同一文件名永远生成同一张图 */
function seedOf(str){
  let h = 2166136261 >>> 0;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function rng(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const PHOTO_STYLES = {
  river:  { sky:['#c9cfca','#9fb0ad'], mid:['#8d9b8f','#6e7f74'], low:['#5d6a60','#43503f'], warm:.30, grain:.10 },
  dorm:   { sky:['#d8d2c2'],           mid:['#a99a83','#8b7c66'], low:['#6a5c4a'],           warm:.55, grain:.14 },
  street: { sky:['#d3d6d2'],           mid:['#a3a49c','#8a8b83'], low:['#5f6058'],           warm:.18, grain:.12 },
  wall:   { sky:['#cfc9bd'],           mid:['#a89e8c','#8d8371'], low:['#6b6252'],           warm:.34, grain:.16 },
  office: { sky:['#e2e0d6'],           mid:['#b7b2a2','#9a9585'], low:['#6f6a5c'],           warm:.40, grain:.13 },
  night:  { sky:['#2b3340','#1d2430'], mid:['#3a4353','#252d3a'], low:['#141a24'],           warm:.10, grain:.30, dark:.45 },
  spring: { sky:['#d9dcd2'],           mid:['#9aa88b','#7d8c6e'], low:['#5e6b52'],           warm:.30, grain:.11 },
  paper:  { sky:['#efeade'],           mid:['#ded6c4','#cfc5b0'], low:['#b9ad95'],           warm:.62, grain:.20 },
  hand:   { sky:['#f6f3ea'],           mid:['#eee9dc'],           low:['#e6e0d0'],           warm:.40, grain:.24, scan:true }
};

/* 主入口：把一张"照片"画到 canvas 上。
   相册里用 CSS 缩到 220px 宽，只有放大时才用原尺寸显示。 */
function drawPhoto(canvas, filename, cap){
  const W = 640, H = (/shot|snap|screen/i.test(filename) ? 460 : 480);
  const r = rng(seedOf(filename));
  canvas.width = W; canvas.height = H;
  const g = canvas.getContext('2d');

  /* 选风格：用文件名与标题一起决定，保证"同类照片"看着像一个地方 */
  const key = styleKey(filename, cap);
  const st = PHOTO_STYLES[key] || PHOTO_STYLES.street;

  /* --- 底：天空/背景 --- */
  const s0 = st.sky[0], s1 = st.sky[1] || st.sky[0];
  const grd = g.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, s0); grd.addColorStop(1, s1);
  g.fillStyle = grd; g.fillRect(0, 0, W, H);

  /* --- 中景：几块横向色带（建筑/墙/水面）--- */
  const horizon = H * (0.34 + r() * 0.20);
  for(let i=0;i<4;i++){
    const y = horizon + (H - horizon) * (i / 4);
    g.fillStyle = mix(st.mid[0], st.mid[1] || st.mid[0], r());
    const hgt = (H - horizon) / 4 + 6;
    g.globalAlpha = 0.85;
    g.fillRect(0, y, W, hgt);
  }
  g.globalAlpha = 1;

  /* --- 竖线：电杆、栏杆、窗框 --- */
  const nV = 3 + Math.floor(r() * 6);
  for(let i=0;i<nV;i++){
    const x = r() * W;
    g.strokeStyle = rgba(mix(st.low[0], st.low[1] || st.low[0], r()), 0.55);
    g.lineWidth = 1 + r() * 3;
    g.beginPath(); g.moveTo(x, H * (0.25 + r() * 0.3)); g.lineTo(x, H); g.stroke();
  }

  /* --- 远景楼：矩形块 --- */
  const nB = 2 + Math.floor(r() * 5);
  for(let i=0;i<nB;i++){
    const bw = 40 + r() * 130, bh = 30 + r() * 120;
    const bx = r() * (W - bw), by = horizon - bh + r() * 20;
    g.fillStyle = rgba(mix(st.mid[1] || st.mid[0], st.low[0], r()), 0.55);
    g.fillRect(bx, by, bw, bh);
  }

  /* --- 前景：地面/桌面 --- */
  g.fillStyle = mix(st.low[0], st.low[1] || st.low[0], 0.4);
  g.fillRect(0, H * 0.80, W, H * 0.20);

  /* --- 一盏灯/一个亮点（夜景才给）--- */
  if(key === 'night'){
    const lx = 0.2 * W + r() * 0.6 * W, ly = H * (0.4 + r() * 0.25);
    const rg = g.createRadialGradient(lx, ly, 2, lx, ly, 70);
    rg.addColorStop(0, 'rgba(255,226,160,0.85)');
    rg.addColorStop(1, 'rgba(255,226,160,0)');
    g.fillStyle = rg; g.beginPath(); g.arc(lx, ly, 70, 0, 6.284); g.fill();
  }

  /* --- 暖色偏移（老数码相机的白平衡）--- */
  if(st.warm){
    g.globalCompositeOperation = 'overlay';
    g.fillStyle = rgba('#ffb45a', st.warm * 0.5);
    g.fillRect(0, 0, W, H);
    g.globalCompositeOperation = 'source-over';
  }

  /* --- 扫描件：纸纹 + 折痕 --- */
  if(st.scan){
    g.strokeStyle = 'rgba(120,110,90,0.20)'; g.lineWidth = 1;
    for(let i=0;i<5;i++){
      const y = H * (0.2 + i * 0.15);
      g.beginPath(); g.moveTo(0, y); g.lineTo(W, y + (r()*8-4)); g.stroke();
    }
    g.fillStyle = 'rgba(255,255,255,0.28)';
    g.fillRect(0, 0, W, H * 0.06);
  }

  /* --- 手写（扫描件专用）：把 caption 当"手写内容"的占位笔画 --- */
  if(key === 'hand') drawHandwriting(g, W, H, cap, r);

  /* --- 暗角 + 颗粒 --- */
  vignette(g, W, H, key === 'night' ? 0.55 : 0.26);
  grain(g, W, H, st.grain, r);

  /* --- JPEG 压缩痕迹（色带 + 8px 块感）--- */
  if(r() < 0.75) banding(g, W, H, r);

  /* --- 日期戳（右下角，老数码相机的橙色字）--- */
  if(/^(river|dorm|street|wall|office|night|spring)|_\d{4}\.jpg$/.test(filename) && r() < 0.8){
    g.font = '13px Consolas, monospace';
    g.fillStyle = 'rgba(255,150,40,0.80)';
    const d = (cap || '').match(/\d{4}/);
    g.fillText('2007 8 14', W - 92, H - 10);
  }

  /* --- 文件名水印（只在放大时显示更细）--- */
  if(/snap_|_old|shot/.test(filename)){
    g.font = '10px Consolas, monospace';
    g.fillStyle = 'rgba(255,255,255,0.72)';
    g.fillText(filename, 8, 14);
  }
}

function styleKey(fn, cap){
  const s = (fn + ' ' + (cap || ''));
  if(/river|bridge|水|河/.test(s)) return 'river';
  if(/dorm|desk|book|coat|宿舍|书|桌子/.test(s)) return 'dorm';
  if(/night|夜|平安/.test(s)) return 'night';
  if(/office|公司|实习/.test(s)) return 'office';
  if(/wall|alley|街|墙|走廊/.test(s)) return 'wall';
  if(/spring|0601|bgl|春天|六月初/.test(s)) return 'spring';
  if(/hand|字|手写/.test(s)) return 'hand';
  return 'street';
}

function mix(a, b, t){
  const A = hex2rgb(a), B = hex2rgb(b);
  return 'rgb(' + Math.round(A[0]+(B[0]-A[0])*t) + ',' +
                  Math.round(A[1]+(B[1]-A[1])*t) + ',' +
                  Math.round(A[2]+(B[2]-A[2])*t) + ')';
}
function hex2rgb(h){
  if(h.charAt(0) !== '#') return [128,128,128];
  return [parseInt(h.substr(1,2),16), parseInt(h.substr(3,2),16), parseInt(h.substr(5,2),16)];
}
function rgba(c, a){
  if(c.charAt(0) === '#') { const p = hex2rgb(c); return 'rgba(' + p[0] + ',' + p[1] + ',' + p[2] + ',' + a + ')'; }
  return c;
}
function vignette(g, W, H, k){
  const rg = g.createRadialGradient(W/2, H/2, Math.min(W,H)*0.28, W/2, H/2, Math.max(W,H)*0.72);
  rg.addColorStop(0, 'rgba(0,0,0,0)');
  rg.addColorStop(1, 'rgba(0,0,0,' + k + ')');
  g.fillStyle = rg; g.fillRect(0, 0, W, H);
}
function grain(g, W, H, k, r){
  const img = g.getImageData(0, 0, W, H), d = img.data;
  const amt = Math.round(k * 120);
  for(let i=0;i<d.length;i+=4){
    const n = (r() * 2 - 1) * amt;
    d[i] += n; d[i+1] += n; d[i+2] += n;
  }
  g.putImageData(img, 0, 0);
}
function banding(g, W, H, r){
  g.globalAlpha = 0.06;
  for(let y=0;y<H;y+=8){
    if(r() < 0.18){
      g.fillStyle = r() < 0.5 ? '#000' : '#fff';
      g.fillRect(0, y, W, 3);
    }
  }
  g.globalAlpha = 1;
}

/* 手写笔画：用一条连续折线模拟字迹，并保留"末横"的两种习惯
   hook=true  → 末横上挑（陆知遥的写法）
   hook=false → 末横平直且更短（另一个人的写法） */
function drawHandwriting(g, W, H, cap, r){
  const hook = /hand_a/.test(cap || '') ? true : (/hand_b/.test(cap || '') ? false : r() < 0.5);
  g.strokeStyle = 'rgba(38,42,60,0.86)';
  g.lineCap = 'round'; g.lineJoin = 'round';
  const rows = 3, baseY = H * 0.30, rowH = H * 0.16;
  for(let row=0; row<rows; row++){
    const y0 = baseY + row * rowH;
    let x = W * 0.16;
    const nCells = 7 + Math.floor(r() * 3);
    const cw = (W * 0.68) / nCells;
    for(let c=0;c<nCells;c++){
      const cn = 3 + Math.floor(r() * 3);
      g.lineWidth = 2.1;
      g.beginPath();
      let px = x, py = y0;
      for(let s=0;s<cn;s++){
        const nx = px + cw * (0.22 + r() * 0.3);
        const ny = y0 - (r() * rowH * 0.55);
        g.moveTo(px, py); g.lineTo(nx, ny);
        px = nx; py = ny;
      }
      /* 末横：这是全作最要紧的一笔 */
      g.lineWidth = 1.9;
      g.beginPath();
      if(hook){
        g.moveTo(x - 1, y0 + 3);
        g.lineTo(x + cw * 0.72, y0 + 3);
        g.lineTo(x + cw * 0.86, y0 - 1.5);          /* 上挑 */
      } else {
        g.moveTo(x + 1, y0 + 3);
        g.lineTo(x + cw * 0.50, y0 + 3);            /* 平直且更短 */
      }
      g.stroke();
      x += cw;
    }
  }
}

/* 旧网页截图：把一段伪 HTML 画成图片 */
function drawShot(canvas, filename, kind){
  const W = 640, H = 460;

  const g = canvas.getContext('2d');
  const old = kind === '2007';
  g.fillStyle = old ? '#f4f4ef' : '#eef1f2'; g.fillRect(0,0,W,H);
  /* 浏览器窗口边 */
  g.fillStyle = '#d7dae0'; g.fillRect(0,0,W,26);
  g.fillStyle = '#40454d'; g.font = '12px "Segoe UI", Tahoma, sans-serif';
  g.fillText('折页' + (old ? '志' : '清') + ' - ' + (old ? '首页' : '首页'), 10, 17);
  g.fillStyle = '#3a3f46'; g.fillRect(W-140, 6, 128, 15);
  g.fillStyle = '#e9ebee'; g.font = '11px Consolas, monospace';
  g.fillText(old ? 'http://zheyue.**.cn/' : 'http://zheyue.pages.dev/', W-136, 18);
  /* 内容：标题 + 导航 + 几行 */
  const bg = old ? 'rgba(0,0,0,0.06)' : 'rgba(0,0,0,0.04)';
  g.fillStyle = bg;
  let y = 48;
  for(let i=0;i<3;i++){ g.fillRect(W/2-i*60, y, i===0?180:i*120, 10); y += 14; }
  y = 96;
  g.fillRect(W/2-230, y, 460, 18);
  y += 30;
  for(let i=0;i<11;i++){
    const w = 200 + ((i*37) % 190);
    g.fillRect(70, y, w, 7);
    y += 15;
  }
  y += 8;
  for(let i=0;i<4;i++){ g.fillRect(70, y, 120 + ((i*53)%150), 7); y += 15; }
  /* 页脚 */
  g.fillStyle = 'rgba(0,0,0,0.10)';
  g.fillRect(0, H-46, W, 1);
  g.fillRect(W/2-90, H-32, 180, 7);
  /* 扫描噪点 */
  const r = rng(seedOf(filename));
  vignette(g, W, H, 0.18);
  grain(g, W, H, 0.09, r);
}

/* ===== js/50-audio.js ===== */
/* ============================================================
   《折页清》 — 声音（WebAudio 运行时合成，零外部文件）
   刻意做得"像个人录的"：有底噪、有起止的杂音、不干净。
   无障碍：默认静音、可跳过、每个声音都有文字说明。
   ============================================================ */

const Audio_ = {
  ctx:null, nodes:[], playing:null, gain:0.35, enabled:true,

  init(){
    if(this.ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return false;
    try{ this.ctx = new AC(); }catch(e){ return false; }
    return true;
  },
  resume(){
    if(!this.ctx) return false;
    if(this.ctx.state === 'suspended') this.ctx.resume();
    return true;
  },
  stopAll(){
    this.nodes.forEach(function(n){ try{ n.stop ? n.stop(0) : n.disconnect(); }catch(e){} });
    this.nodes = []; this.playing = null;
  },
  /* 白噪缓冲 */
  noise(sec){
    const ctx = this.ctx, len = Math.max(1, Math.floor(ctx.sampleRate * sec));
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for(let i=0;i<len;i++){
      const w = Math.random() * 2 - 1;
      last = (last + 0.02 * w) / 1.02;      /* 棕噪，比白噪更像环境 */
      d[i] = last * 3.2 + w * 0.12;
    }
    return buf;
  },
  loopNoise(sec, filterHz, q, g0){
    const ctx = this.ctx;
    const src = ctx.createBufferSource();
    src.buffer = this.noise(sec); src.loop = true;
    const f = ctx.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = filterHz; f.Q.value = q || 0.7;
    const g = ctx.createGain(); g.gain.value = g0;
    src.connect(f); f.connect(g); g.connect(ctx.destination);
    src.start();
    this.nodes.push(src, f, g);
    return { src:src, g:g };
  },
  tone(freq, t0, dur, type, vol, glide){
    const ctx = this.ctx;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if(glide) o.frequency.linearRampToValueAtTime(glide, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t0 + Math.min(0.06, dur*0.25));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
    this.nodes.push(o, g);
  },
  pluck(freq, t0){
    const ctx = this.ctx;
    [1, 2, 3.01, 4.7].forEach((h, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = i === 0 ? 'triangle' : 'sine';
      o.frequency.value = freq * h;
      const v = 0.16 / (i + 1.4);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(v, t0 + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.5 / (1 + i*0.6));
      o.connect(g); g.connect(ctx.destination);
      o.start(t0); o.stop(t0 + 1.8);
      this.nodes.push(o, g);
    });
  },

  /* 每个 patch 一个生成函数 */
  patches:{
    rain(){ this.loopNoise(3, 3200, 0.45, 0.10); this.loopNoise(3, 620, 0.6, 0.06); },
    rain2(){ this.loopNoise(3, 2600, 0.5, 0.085); this.loopNoise(3, 520, 0.6, 0.055);
      const ctx = this.ctx, t = ctx.currentTime + 0.4;
      this.tone(180, t, 0.10, 'square', 0.05, 90);      /* 远处关门 */
      this.tone(120, t + 0.14, 0.16, 'sine', 0.04, 70);
    },
    guitar(){ this.chords([[196,246.9,293.7],[174.6,220,261.6],[146.8,196,246.9],[164.8,220,246.9]], 0.62, 0.6); },
    guitar2(){ this.chords([[196,246.9,293.7],[174.6,220,261.6],[146.8,196,246.9],[130.8,164.8,196]], 0.78, 0.62); },
    hum(){ const ctx = this.ctx, t0 = ctx.currentTime;
      [220, 277, 330, 294, 262].forEach((f, i) => this.tone(f, t0 + i*0.55, 0.5, 'sine', 0.05));
    },
    book(){ const ctx = this.ctx, t0 = ctx.currentTime;
      for(let i=0;i<4;i++){
        const t = t0 + i * 0.9 + Math.random()*0.2;
        this.tone(900 + Math.random()*500, t, 0.05, 'square', 0.03);
        this.loopNoiseAt(t, 0.12, 4200, 0.05);
      }
    },
    step(){ const ctx = this.ctx, t0 = ctx.currentTime;
      for(let i=0;i<9;i++){
        const t = t0 + i * 0.52;
        this.tone(88 - i*1.2, t, 0.09, 'sine', 0.10, 62);
        this.loopNoiseAt(t, 0.06, 2600, 0.045);
      }
    }
  },
  loopNoiseAt(t0, dur, hz, vol){
    const ctx = this.ctx;
    const src = ctx.createBufferSource();
    src.buffer = this.noise(dur + 0.2);
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = hz; f.Q.value = 1.1;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(ctx.destination);
    src.start(t0); src.stop(t0 + dur + 0.05);
    this.nodes.push(src, f, g);
  },
  chords(list, gap, dur){
    const ctx = this.ctx, t0 = ctx.currentTime;
    list.forEach((ch, i) => {
      ch.forEach(f => this.pluck(f, t0 + i * gap));
      /* 换气：每两拍之间留一点气口（吉他版和人声版的气口位置不同） */
      if(i % 2 === 1) this.loopNoiseAt(t0 + i * gap + dur * 0.5, 0.16, 900, 0.02);
    });
  },

  play(patch){
    if(!this.enabled) return false;
    if(!this.init()) return false;
    this.resume();
    this.stopAll();
    const fn = this.patches[patch] || this.patches.rain;
    try{ fn.call(this); }catch(e){ logErr('audio:' + patch + ':' + e.message); return false; }
    this.playing = patch;
    return true;
  }
};

/* 播放器小控件：返回 DOM */
function audioWidget(patch, label, note){
  const wrap = document.createElement('span');
  wrap.className = 'audio';
  const b = document.createElement('a');
  b.href = '#'; b.textContent = '▶ 播放';
  b.setAttribute('role', 'button');
  b.setAttribute('aria-label', '播放：' + label + '（约 6 秒，可随时停止）');
  let on = false;
  b.addEventListener('click', function(ev){
    ev.preventDefault();
    if(on){ Audio_.stopAll(); on = false; b.textContent = '▶ 播放'; return; }
    if(Audio_.play(patch)){ on = true; b.textContent = '■ 停止'; }
    else { b.textContent = '（浏览器不支持）'; }
  });
  wrap.appendChild(b);
  if(note){
    const n = document.createElement('span');
    n.className = 'tiny dim';
    n.style.marginLeft = '6px';
    n.textContent = note;
    wrap.appendChild(n);
  }
  return wrap;
}

/* ===== js/60-state.js ===== */
/* ============================================================
   《折页清》 — 存档 / 状态 / 路由 / 搜索
   存档只用 localStorage（键：zheyue.save.v1），可随时清空。
   全程零网络请求。
   ============================================================ */

const SAVE_KEY = 'zheyue.save.v1';
const ERRORS = [];

function logErr(msg){
  ERRORS.push({ t:new Date().toISOString(), m:String(msg) });
  if(ERRORS.length > 60) ERRORS.shift();
  if(window.__DEBUG) renderDebug();
}
window.addEventListener('error', function(e){ logErr('js: ' + e.message + ' @' + (e.lineno||'?')); });

/* ---------------- 状态 ---------------- */
const State = {
  visited:    {},   /* id -> 次数 */
  historyLog: [],   /* 跳转历史 */
  foundRoutes:[],   /* 玩家亲自输入成功的路径 */
  searches:   [],   /* 搜过的词 */
  sound:      false,
  visitCount: 0,
  firstSeen:  null,
  flags:      { sawOld:false, sawArchive:false, sawTerminalNote:false, logRead:false },
  ui:         { fs:'', anim:true, flash:true, contrast:false, showSource:false }

  ,load(){
    try{
      const raw = localStorage.getItem(SAVE_KEY);
      if(!raw) return false;
      const s = JSON.parse(raw);
      Object.assign(this, s);
      this.ui = Object.assign({ fs:'', anim:true, flash:true, contrast:false, showSource:false }, s.ui || {});
      return !!(this.visited && Object.keys(this.visited).length);
    }catch(e){ logErr('save-read: ' + e.message); return false; }
  }
  ,save(){
    try{
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        visited:this.visited, historyLog:this.historyLog.slice(-120),
        foundRoutes:this.foundRoutes, searches:this.searches.slice(-40),
        sound:this.sound, visitCount:this.visitCount, firstSeen:this.firstSeen,
        flags:this.flags, ui:this.ui
      }));
    }catch(e){ logErr('save-write: ' + e.message); }
  }
  ,reset(){
    try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
    this.visited={}; this.historyLog=[]; this.foundRoutes=[]; this.searches=[];
    this.visitCount=0; this.firstSeen=null;
    this.flags={ sawOld:false, sawArchive:false, sawTerminalNote:false, logRead:false };
  }
  ,count(){ return Object.keys(this.visited).length; }
  ,seen(id){ return !!this.visited[id]; }
};

/* ---------------- 路由 ---------------- */
function currentRoute(){
  const h = (location.hash || '').replace(/^#/, '');
  let route = '', p = '';
  if(h){
    const q = h.indexOf('?');
    route = q < 0 ? h : h.slice(0, q);
    p = q < 0 ? '' : h.slice(q + 1);
  } else {
    const sp = new URLSearchParams(location.search);
    route = sp.get('p') || '';
    if(route) p = 'q=' + encodeURIComponent(sp.get('q') || '');
  }
  route = decodeURIComponent(route);
  const params = {};
  if(p){
    p.split('&').forEach(function(kv){
      const i = kv.indexOf('=');
      if(i > 0) params[decodeURIComponent(kv.slice(0,i))] = decodeURIComponent(kv.slice(i+1).replace(/\+/g,' '));
    });
  }
  return { route: route, params: params };
}

function go(route, params, isUserTyped){
  const qs = Object.keys(params || {}).map(function(k){
    return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
  }).join('&');
  const target = '#' + route + (qs ? '?' + qs : '');
  if(isUserTyped){
    const norm = normPath(route);
    if(State.foundRoutes.indexOf(norm) < 0) State.foundRoutes.push(norm);
  }
  if(location.hash === target){ render(); return; }
  location.hash = target;   /* 触发 hashchange */
}

/* 把 route 解析成页面 id；支持直接输入真实路径 */
function resolveRoute(route, params){
  if(!route || route === '/' || route === '') return 'home';
  /* 1) 先按页面 id 认（站内链接都是 #/页面id 的形式） */
  let key = String(route).replace(/^\/+|\/+$/g, '');
  if(!key) return 'home';
  if(PAGES[key]){
    /* 同一个页面 id 可以带参数表示子视图：日记带月份就是"某个月的日记"，
       链接和手输路径两条路都要能进得来 */
    if(params && params.m && key === 'diary') return 'diaryMonth';
    return key;
  }
  /* 2) 再按真实路径认（玩家在地址框里手输的那些） */
  const norm = normPath(route);
  if(PATH_ALIAS[norm]) return PATH_ALIAS[norm];
  const byPath = Object.keys(PAGES).filter(function(id){
    return (PAGES[id].paths || []).some(function(p){ return normPath(p) === norm; });
  });
  if(byPath.length) return byPath[0];
  /* 3) 带月份的日记路径：/diary/200810/ 这种写法也该能进 */
  const m = /^\/diary\/(\d{4})(\d{2})\/?$/.exec(norm);
  if(m) return 'diaryMonth';
  return 'notfound';
}

/* 从路由与参数里取出这次要渲染的月份（YYYY-MM） */
function monthOfRoute(route, params){
  if(params && params.m) return String(params.m).replace('/', '-');
  const m = /^\/?diary\/(\d{4})-?(\d{2})\/?$/.exec(String(route || '').replace(/^\/+/,'/'));
  if(m) return m[1] + '-' + m[2];
  if(params && params.j){
    const e = DIARY.filter(function(x){ return x.id === params.j; })[0];
    if(e) return e.d.slice(0,7);
  }
  return '';
}

function currentPathOf(id){
  const pg = PAGES[id] || PAGES.notfound;
  return (pg.paths && pg.paths[0]) || ('/' + id + '/');
}

/* ---------------- 站内搜索 ---------------- */
function tokenize(q){
  return String(q || '').toLowerCase().split(/[\s,，。、]+/).filter(Boolean);
}

/* 建立索引：日记 / 留言 / 音乐 / 相册 / 更新日志 / 页面标题 */
function buildIndex(){
  const idx = [];
  DIARY.forEach(function(e){
    idx.push({ id:e.id, kind:'diary', del:!!e.del, d:e.d, title:e.title,
      path:'/diary/' + e.d.slice(0,4) + e.d.slice(5,7) + '/#' + e.id,
      title2:e.title, text:e.title + ' ' + e.body + ' ' + (e.notes||''),
      where:'日记' + (e.del ? '（已删除条目）' : '') });
  });
  Object.keys(GUEST).forEach(function(k){
    const pid = k === 'g2007' ? 'guest' : (k === 'g2009' ? 'guest2009' : 'guestNow');
    GUEST[k].forEach(function(m, i){
      idx.push({ id:pid + '-m' + i, kind:'guest', page:pid, d:m.d, title:(m.name||'') + '：' + m.tx.slice(0,26),
        path:currentPathOf(pid) + '#' + pid + '-m' + i,
        text:(m.name||'') + ' ' + m.tx + ' ' + (m.note||''),
        where:'留言板' + (k === 'gNow' ? '（现在）' : k === 'g2009' ? '（2009）' : '（2007）') });
    });
  });
  MUSIC.forEach(function(m){
    idx.push({ id:m.id, kind:'music', page:m.page, d:m.d, title:m.t,
      path:currentPathOf(m.page) + '#' + m.id,
      text:m.t + ' ' + m.by + ' ' + (m.note||'') + ' ' + m.kind,
      where:'音乐' });
  });
  ALBUMS.forEach(function(a){
    a.items.forEach(function(it, i){
      idx.push({ id:a.page + '-p' + i, kind:'photo', page:a.page, d:a.d, title:it.cap,
        path:currentPathOf(a.page) + '#' + it.f,
        text:it.cap + ' ' + it.f + ' ' + a.title, where:'相册' });
    });
  });
  ALBUM_GHOSTS.forEach(function(it, i){
    idx.push({ id:'ghost-p' + i, kind:'photo', d:'2007-11-03', title:it.cap,
      path:currentPathOf('photoOld') + '#' + it.f, text:it.cap + ' ' + it.f, where:'相册（旧）' });
  });
  LOG.forEach(function(l, i){
    idx.push({ id:'log' + i, kind:'log', d:l.d, title:l.d + ' ' + l.t,
      path:currentPathOf('log') + '#log' + i, text:l.t, where:'更新记录' });
  });
  idx.push({ id:'f-guxing', kind:'friend', d:'2008-02-14', title:'小满的小站（guxing.**.net）',
    path:currentPathOf('friendsOld') + '#guxing',
    text:'小满的小站 guxing 谷行 友情链接 她居然也弄了一个 一年两条', where:'友情链接' });
  idx.push({ id:'dl-rain', kind:'dl', d:'2010-05-11', title:'rain.wav',
    path:currentPathOf('download') + '#dl', text:'rain.wav 首页那个声音 原始文件', where:'下载' });
  return idx;
}

const SEARCH_INDEX = buildIndex();

function search(q){
  const toks = tokenize(q);
  if(!toks.length) return { q:q, hits:[], deleted:0, total:0 };
  const hits = [];
  SEARCH_INDEX.forEach(function(it){
    const hay = (it.title + ' ' + it.text + ' ' + it.where).toLowerCase();
    let score = 0, all = true;
    toks.forEach(function(t){
      if(hay.indexOf(t) >= 0){
        score += (it.title.toLowerCase().indexOf(t) >= 0 ? 3 : 1);
      } else all = false;
    });
    if(all) hits.push(Object.assign({ score:score }, it));
  });
  hits.sort(function(a,b){ return b.score - a.score || String(b.d).localeCompare(String(a.d)); });
  return { q:q, hits:hits, deleted:hits.filter(function(h){ return h.del; }).length, total:hits.length };
}

/* 站内"文章正文高亮"用的辅助 */
function highlight(text, q){
  const toks = tokenize(q);
  if(!toks.length) return [document.createTextNode(text)];
  let frag = document.createDocumentFragment();
  let rest = String(text);
  while(rest.length){
    let best = -1, bestLen = 0;
    toks.forEach(function(t){
      const i = rest.toLowerCase().indexOf(t);
      if(i >= 0 && (best < 0 || i < best)){ best = i; bestLen = t.length; }
    });
    if(best < 0){ frag.appendChild(document.createTextNode(rest)); break; }
    if(best > 0) frag.appendChild(document.createTextNode(rest.slice(0, best)));
    const mark = document.createElement('span');
    mark.className = 'hit';
    mark.textContent = rest.substr(best, bestLen);
    frag.appendChild(mark);
    rest = rest.slice(best + bestLen);
  }
  return [frag];
}

/* ===== js/70-render.js ===== */
/* ============================================================
   《折页清》 — 渲染器
   一次渲染 = 一个页面的完整 HTML。没有 HUD、没有任务栏、没有进度。
   ============================================================ */

/* ---------------- DOM 小工具 ---------------- */
function E(tag, attrs, children){
  const el = document.createElement(tag);
  if(attrs) Object.keys(attrs).forEach(function(k){
    const v = attrs[k];
    if(v === null || v === undefined) return;
    if(k === 'class') el.className = v;
    else if(k === 'text') el.textContent = v;
    else if(k === 'html') el.innerHTML = v;
    else if(k === 'style') el.setAttribute('style', v);
    else if(k.slice(0,2) === 'on') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  });
  (children || []).forEach(function(c){
    if(c === null || c === undefined || c === false) return;
    el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return el;
}
function A(id, label, params){
  const pg = PAGES[id] || PAGES.notfound;
  const qs = Object.assign({}, params || {});
  const href = '#/' + id + (Object.keys(qs).length ? '?' + Object.keys(qs).map(function(k){
    return encodeURIComponent(k) + '=' + encodeURIComponent(qs[k]); }).join('&') : '');
  return E('a', { href:href, title:pg.title }, [label]);
}
function txt(s){ return document.createTextNode(s); }
function P(s, cls){ return E('p', cls ? { class:cls } : null, [s]); }

/* 日期显示习惯：早期写 2007-08-14，代管期写 2007 年 8 月 14 日 */
function fmtDate(d, era){
  const y = d.slice(0,4), m = +d.slice(5,7), dd = +d.slice(8,10);
  if(era === '2012') return y + ' 年 ' + m + ' 月 ' + dd + ' 日';
  return d;
}
function fmtMonth(k){ return k.slice(0,4) + ' 年 ' + (+k.slice(5,7)) + ' 月'; }

/* 页面在标题里怎么称呼自己（日记要带上月份，像真站那样） */
function titleOf(pg, loc){
  if(pg.kind === 'diary'){
    const m = monthOfRoute(loc.route, loc.params);
    if(m) return '日记 - ' + fmtMonth(m);
  }
  return pg.title;
}

/* ---------------- 骨架 ---------------- */
function render(){
  const loc = currentRoute();
  const id = resolveRoute(loc.route, loc.params);
  const pg = PAGES[id] || PAGES.notfound;
  render.pageId = id;

  /* 记录访问 */
  const first = State.touch(id);
  State.pushHistory(id);

  /* 时代主题 */
  const html = document.documentElement;
  ['theme-2007','theme-2009','theme-2011'].forEach(function(c){ html.classList.remove(c); });
  html.classList.add(pg.era === '2012' ? 'theme-2011' : ('theme-' + (pg.era || '2007')));

  /* 正文 */
  const main = document.getElementById('main');
  main.innerHTML = '';
  try{
    (RENDERERS[pg.kind] || RENDERERS.notfound)(main, pg, id, loc.params);
  }catch(e){
    logErr('render:' + id + ': ' + e.message);
    main.appendChild(E('div', { class:'termbox' }, ['这个页面没有正确保存下来。', E('br'), '（原站这里可能也是这样。）']));
  }

  /* 面包屑 */
  const crumb = document.getElementById('crumb');
  crumb.innerHTML = '';
  crumb.appendChild(A('home', SITE.name));
  crumb.appendChild(txt(' › '));
  crumb.appendChild(document.createTextNode(titleOf(pg, loc)));

  /* 导航与页脚 */
  renderNav(pg);
  renderFooter(pg);

  /* 标题（真实个人站的写法） */
  document.title = SITE.name + ' | ' + titleOf(pg, loc);

  /* 无障碍 / 面板状态 */
  applyUI();
  if(window.__DEBUG) renderDebug();
  State.save();
  window.scrollTo(0, 0);
  Audio_.stopAll();
}

function renderNav(pg){
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  nav.style.display = pg.noNav ? 'none' : '';
  if(pg.noNav) return;
  NAV.forEach(function(item, i){
    if(i) nav.appendChild(E('span', { class:'sep' }, ['|']));
    nav.appendChild(A(item.id, item.label));
  });
  /* 存档版本页面顶部提示：真实快照站会说明"这是存档" */
  if(pg.kind === 'archiveYear' || pg.kind === 'archDiary' || pg.kind === 'archMusic' ||
     pg.kind === 'archFriends' || pg.kind === 'shot'){
    const bar = E('div', { class:'small dim', style:'text-align:center;padding:4px 0 0' },
      ['这是旧页面存档，不是本站现在的样子。']);
    nav.parentNode.insertBefore(bar, nav.nextSibling);
    bar.id = 'archbar';
  } else {
    const old = document.getElementById('archbar');
    if(old) old.remove();
  }
}

function renderFooter(pg){
  const f = document.getElementById('footer');
  f.innerHTML = '';
  const fl = E('div', null, []);
  FOOTLINKS.forEach(function(item, i){
    if(i) fl.appendChild(E('span', { class:'dim' }, [' · ']));
    fl.appendChild(A(item.id, item.label));
  });
  f.appendChild(fl);

  const era = pg.era;
  let by = '本站由 ' + (era === '2012' ? '迟夏' : '陆知遥') + ' 制作';
  if(era === '2012') by = '本站由 谷行 维护';
  f.appendChild(E('div', { class:'byline' }, [by]));
  f.appendChild(E('div', { class:'stamp' }, [

  ]));

    f.appendChild(E('div', { class:'stamp', style:'margin-top:2px' },

}

RENDERERS.diary = function(main, pg, id, params){
  main.innerHTML = '';
  const single = params && params.j;
  const month = monthOfRoute(currentRoute().route, params);

  if(single){
    const e = DIARY.filter(function(x){ return x.id === single; })[0];
    if(!e){ main.appendChild(notFoundBox()); return; }
    if(e.del && !State.flags.sawArchive){
      main.appendChild(E('div', { class:'termbox' }, [

      ]));
      main.appendChild(E('div', { class:'small', style:'margin-top:10px' }, [
        '存档里还有：', A('a2009diary', '2008 年那几篇')
      ]));
      return;
    }
    main.appendChild(entryBlock(e, true, params.q));
    if(params.q) setTimeout(function(){ scrollToId(e.id); }, 60);
    return;
  }

  const keys = Object.keys(DIARY_MONTHS).sort().reverse();

  if(month){
    main.appendChild(E('h2', { style:'margin-top:0' }, [fmtMonth(month)]));
    const ids = DIARY_MONTHS[month] || [];
    if(!ids.length){
      main.appendChild(P('这个月没有东西。', 'small dim'));
    }
    ids.map(function(eid){
      return DIARY.filter(function(e){ return e.id === eid; })[0];
    }).sort(function(a,b){ return a.d.localeCompare(b.d); }).forEach(function(e){
      main.appendChild(entryBlock(e, false, params.q));
    });
    /* 上一个 / 下一个月的链接，像真站的月份导航 */
    const idx = keys.indexOf(month);
    const prev = keys[idx + 1], next = keys[idx - 1];
    const nav = E('div', { class:'small', style:'margin-top:16px' }, []);
    if(prev) nav.appendChild(A('diaryMonth', '← ' + fmtMonth(prev), { m:prev }));
    if(prev && next) nav.appendChild(txt('　·　'));
    if(next) nav.appendChild(A('diaryMonth', fmtMonth(next) + ' →', { m:next }));
    main.appendChild(nav);
    main.appendChild(E('div', { class:'small dim', style:'margin-top:6px' }, [
      A('diary', '全部月份')
    ]));
    return;
  }

  /* 没给月份：显示最近三个月 + 月份列表 */
  keys.slice(0, 3).forEach(function(k){
    main.appendChild(E('h2', null, [fmtMonth(k)]));
    DIARY_MONTHS[k].map(function(eid){
      return DIARY.filter(function(e){ return e.id === eid; })[0];
    }).sort(function(a,b){ return a.d.localeCompare(b.d); }).forEach(function(e){
      main.appendChild(entryBlock(e, false));
    });
  });
  main.appendChild(E('div', { class:'small dim', style:'margin-top:14px' }, [
    '更早的和更晚的都在 ', A('diary', '月份列表'), ' 里。'
  ]));

  keys.forEach(function(k){
    all.appendChild(E('span', null, [A('diaryMonth', fmtMonth(k), { m:k }), txt('　')]));
  });
  main.appendChild(all);
};

function entryBlock(e, big, hl){

  const inner = E('div', { class:'inner' }, []);

    ]));
  }
  const bar = E('div', { class:'vbar' }, []);
  const close = E('button', { class:'btn' }, ['关闭']);
  close.addEventListener('click', closeViewer);
  bar.appendChild(close);
  inner.appendChild(bar);
  v.appendChild(inner);
  v.addEventListener('click', function(ev){ if(ev.target === v) closeViewer(); });
  document.body.appendChild(v);
  const esc = function(ev){ if(ev.key === 'Escape'){ closeViewer(); document.removeEventListener('keydown', esc); } };
  document.addEventListener('keydown', esc);
  close.focus();
}
function closeViewer(){
  const v = document.getElementById('viewer');
  if(v) v.parentNode.removeChild(v);
}

/* 波形图：用固定种子的数据画，两版参数不同 → 肉眼可辨 */
function waveform(seedName, label){
  const W = 420, H = 52;
  const c = E('canvas', { class:'wave', width:W, height:H });
  c.setAttribute('role', 'img');
  c.setAttribute('aria-label', '波形图：' + label);
  setTimeout(function(){
    const g = c.getContext('2d');
    const r = rng(seedOf('wave:' + seedName));
    const fast = /2007|2008/.test(seedName + label) ? 1 : 0.72;   /* 第二版更慢 */
    const breathe = /重录|2011/.test(label) ? 9 : 15;            /* 换气位置不同 */
    g.fillStyle = '#fafafa'; g.fillRect(0,0,W,H);
    g.strokeStyle = 'rgba(30,60,110,0.75)'; g.lineWidth = 1;
    g.beginPath();
    for(let x=0;x<W;x++){
      const env = (0.34 + 0.30 * Math.abs(Math.sin(x / breathe + r()*0.05))) * fast;
      const y = H/2 - Math.sin(x * 0.42) * env * (H/2.4);
      x === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
    }
    g.stroke();
    g.strokeStyle = 'rgba(30,60,110,0.35)';
    g.beginPath();
    for(let x=0;x<W;x++){
      const env = (0.34 + 0.30 * Math.abs(Math.sin(x / breathe))) * fast;
      const y = H/2 + Math.sin(x * 0.42 + 0.6) * env * (H/2.4);
      x === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
    }
    g.stroke();
    g.strokeStyle = 'rgba(0,0,0,0.10)';
    g.beginPath(); g.moveTo(0, H/2); g.lineTo(W, H/2); g.stroke();
  }, 0);
  return c;
}

  f.appendChild(tx);
  const btn = E('button', { class:'btn', style:'margin-top:8px' }, ['提交']);
  const out = E('div', { style:'margin-top:10px' }, []);
  btn.addEventListener('click', function(){
    const body = tx.value.trim();
    if(!body){ out.textContent = '还没写东西。'; return; }
    const n = (name.value.trim() || '过路的人');
    GUEST.gNow.push({ d: nowStamp(), by:'me', name:n, tx:body });
    State.flags.playerPosted = true;
    /* 重新渲染留言板 */
    State.save(); render();
    const el = document.getElementById('guestNow-m' + (GUEST.gNow.length - 1));
    if(el) el.scrollIntoView();
  });
  f.appendChild(btn);
  f.appendChild(out);
  return f;
}

function nowStamp(){
  const d = new Date();
  function z(n){ return (n<10?'0':'') + n; }
  return d.getFullYear() + '-' + z(d.getMonth()+1) + '-' + z(d.getDate()) + ' ' + z(d.getHours()) + ':' + z(d.getMinutes());
}

/* ============================================================
   《折页清》 — 启动 / 站内搜索页 / 调试面板 / 无障碍设置
   ============================================================ */

window.__BUILD__ = '2026-10-01 14:03';

/* ---------------- 调试开关：?debug=1 或 #/xxx?debug=1 ---------------- */
window.__DEBUG = (function(){
  try{
    if(new URLSearchParams(location.search).get('debug') === '1') return true;
    if(/(^|[?&#])debug=1/.test(location.hash)) return true;
  }catch(e){}
  return false;
})();

/* ---------------- 状态初始化的收尾（load 在 60-state.js 定义）---------------- */
State.load();
State.visitCount = State.visitCount || 0;
State.firstSeen = State.firstSeen || todayStr();
/* 站点的"现在"锚定在很久以后；不随每次刷新变化，这样存档才有意义 */
State.epoch = State.epochSet || (State.epochSet = '2026-03-08');

function todayStr(){
  const d = new Date();
  function z(n){ return (n<10?'0':'')+n; }
  return d.getFullYear() + '-' + z(d.getMonth()+1) + '-' + z(d.getDate());
}

State.visitCount++;
if(State.visitCount > 1) State.returning = true;

/* 记录访问过的页面 */
State.touch = function(id){
  const first = !this.visited[id];
  this.visited[id] = (this.visited[id] || 0) + 1;
  if(first) this.save();
  return first;
};
State.pushHistory = function(id){
  this.historyLog.push({ id:id, t:new Date().toISOString() });
  if(this.historyLog.length > 120) this.historyLog.shift();
};

/* ---------------- 无障碍 / 显示设置 ---------------- */
function applyUI(){
  const h = document.documentElement;
  const u = State.ui;
  h.classList.remove('fs-l','fs-xl');
  if(u.fs === 'l') h.classList.add('fs-l');
  if(u.fs === 'xl') h.classList.add('fs-xl');
  h.classList.toggle('no-anim', !u.anim);
  h.classList.toggle('no-flash', !u.flash);
  h.classList.toggle('contrast', !!u.contrast);
  Audio_.enabled = !!State.sound;
}

/* ---------------- 工具条与面板 ---------------- */
function buildChrome(){
  /* 右下角工具（极克制，不用"菜单"这个词） */
  const tools = E('div', { id:'tools' }, []);
  const mk = function(label, fn, aria){
    const a = E('a', { href:'#', 'aria-label':aria || label }, [label]);
    a.addEventListener('click', function(ev){ ev.preventDefault(); fn(); });
    return a;
  };
  tools.appendChild(mk('找东西', function(){ toggleSearch(); }, '在站内搜索'));
  tools.appendChild(mk('设置', function(){ togglePanel(); }, '显示与无障碍设置'));
  document.body.appendChild(tools);

  /* 声音开关（2007 年个人站审美：一个小图标） */
  const snd = E('div', { id:'snd' }, []);
  const sa = E('a', { href:'#', title:'声音', 'aria-label':'打开或关闭本站声音' }, ['🔈']);
  sa.addEventListener('click', function(ev){
    ev.preventDefault();
    State.sound = !State.sound;
    Audio_.enabled = State.sound;
    if(!State.sound) Audio_.stopAll();
    sa.textContent = State.sound ? '🔊' : '🔈';
    State.save();
  });
  sa.textContent = State.sound ? '🔊' : '🔈';
  snd.appendChild(sa);
  document.body.appendChild(snd);

  /* 设置面板（默认隐藏；隐藏时连内容都不生成，
     免得读屏软件在没有 aria-hidden 保护的情况下先读到一堆控件） */
  document.body.appendChild(E('div', { id:'panel', class:'hide', 'aria-hidden':'true',
    role:'dialog', 'aria-label':'设置' }, [
    E('h3', null, [ '设置', E('a', { href:'#', class:'x', 'aria-label':'关闭设置' }, ['关闭']) ])
  ]));
  document.getElementById('panel').querySelector('.x').addEventListener('click', function(ev){
    ev.preventDefault(); togglePanel(false);
  });

  if(window.__DEBUG){
    document.body.appendChild(E('div', { id:'dbg' }, [
      E('h3', null, ['调试面板（?debug=1）', E('a', { href:'#', class:'x' }, ['关闭'])])
    ]));
    document.getElementById('dbg').querySelector('.x').addEventListener('click', function(ev){
      ev.preventDefault(); document.getElementById('dbg').classList.add('hide');
    });
  }
}

function togglePanel(force){
  const p = document.getElementById('panel');
  const show = force === undefined ? p.classList.contains('hide') : force;
  if(!show){
    p.classList.add('hide');
    p.setAttribute('aria-hidden', 'true');
    return;
  }
  p.classList.remove('hide');
  p.setAttribute('aria-hidden', 'false');
  renderPanel();
}

function renderPanel(){
  const p = document.getElementById('panel');
  /* 保留标题行 */
  while(p.children.length > 1) p.removeChild(p.lastChild);
  const u = State.ui;
  function chk(label, key, note){
    const id = 'ui-' + key;
    const input = E('input', { type:'checkbox', id:id });
    input.checked = !!u[key];
    input.addEventListener('change', function(){
      u[key] = input.checked; applyUI(); State.save();
    });
    return E('div', { class:'row' }, [input, E('label', { for:id, style:'display:inline;margin-left:4px' }, [label]),
      note ? E('div', { class:'tiny dim', style:'margin-left:20px' }, [note]) : null]);
  }
  p.appendChild(E('h3', null, ['显示']));
  const fs = E('select', { 'aria-label':'字号' }, [
    E('option', { value:'' }, ['正常']),
    E('option', { value:'l' }, ['大一点']),
    E('option', { value:'xl' }, ['更大'])
  ]);
  fs.value = u.fs || '';
  fs.addEventListener('change', function(){ u.fs = fs.value; applyUI(); State.save(); });
  p.appendChild(E('div', { class:'row' }, ['字号：', fs]));
  p.appendChild(chk('关闭闪烁效果', 'flash'));
  p.appendChild(chk('关闭动画', 'anim'));
  p.appendChild(chk('高对比（黑字白底）', 'contrast'));

  p.appendChild(E('h3', null, ['声音']));
  p.appendChild(chk('开启声音', 'sound', '默认关闭。所有声音都能用文字代替。'));

  p.appendChild(E('h3', null, ['存档']));
  p.appendChild(E('div', { class:'tagbar' }, [
    '翻过的页面：' + State.count() + ' 个　来过：' + State.visitCount + ' 次'
  ]));
  const rs = E('button', { class:'btn', style:'margin-top:6px' }, ['重新开始']);
  rs.addEventListener('click', function(){
    if(!confirm('清掉所有记录，从头开始？')) return;
    State.reset(); State.visitCount = 1; State.firstSeen = todayStr();
    togglePanel(false);
    go('/'); render();
  });
  p.appendChild(rs);

  p.appendChild(E('h3', null, ['关于这个站']));
  p.appendChild(E('div', { class:'tiny dim' }, [
    '所有内容都存在这一个网页文件里，离线也能看。',
    E('br'), '站上不做任何网络请求，不读你的浏览记录、位置、摄像头或麦克风。',
    E('br'), '设置只存在你自己的浏览器里。'
  ]));
}

/* ---------------- 站内搜索 ---------------- */
function toggleSearch(){
  const old = document.getElementById('searchwrap');
  if(old){ old.remove(); return; }
  const main = document.getElementById('main');
  const w = E('div', { id:'searchwrap', class:'sbox' }, []);
  const input = E('input', { type:'text', placeholder:'站内搜索：找个词试试', 'aria-label':'站内搜索' });
  const btn = E('button', { class:'btn', style:'margin-left:6px' }, ['搜']);
  const out = E('div', { class:'sres' }, []);
  function run(){
    const q = input.value.trim();
    if(!q) return;
    if(State.searches.indexOf(q) < 0) State.searches.push(q);
    State.save();
    renderResults(out, q);
  }
  btn.addEventListener('click', run);
  input.addEventListener('keydown', function(ev){ if(ev.key === 'Enter') run(); });
  w.appendChild(input); w.appendChild(btn); w.appendChild(out);
  main.insertBefore(w, main.firstChild);
  input.focus();
}
function renderResults(out, q){
  out.innerHTML = '';
  const r = search(q);
  out.appendChild(E('div', { class:'small dim' }, [
    '找到 ' + r.total + ' 条' + (r.deleted ? '（其中 ' + r.deleted + ' 条已删除）' : '')
  ]));
  if(!r.total){
    out.appendChild(E('div', { class:'small' }, [
      '没有。',
      E('br'),
      '本站很多东西早就删了，搜不到很正常。'
    ]));
    return;
  }
  r.hits.slice(0, 30).forEach(function(h){
    const box = E('div', { class:'sitem' }, []);
    const t = E('div', { class:'st' }, []);
    if(h.del){
      t.appendChild(E('del', null, [h.title]));
    } else {
      const a = E('a', { href:'#' + h.path.replace(/^\//,'').replace(/#/,'?j=') }, [h.title]);
      a.addEventListener('click', function(ev){ ev.preventDefault(); jumpTo(h); });
      t.appendChild(a);
    }
    box.appendChild(t);
    box.appendChild(E('div', { class:'su' }, [h.where + '　' + (h.d || '') + '　' + h.path]));
    box.appendChild(E('div', { class:'sx' }, [String(h.text).slice(0, 88) + (String(h.text).length > 88 ? '…' : '')]));
    out.appendChild(box);
  });
}

/* 跳到搜索命中的位置 */
function jumpTo(h){
  if(h.kind === 'diary'){
    const e = DIARY.filter(function(x){ return x.id === h.id; })[0];
    if(e && e.del){
      go('/archive/2009/diary/'); return;
    }
    go('/diary/', { m:e.d.slice(0,4) + '-' + e.d.slice(5,7), j:e.id });
    return;
  }
  if(h.kind === 'guest'){
    const pid = h.id.split('-m')[0];
    go(currentPathOf(pid));
    setTimeout(function(){ scrollToId(h.id); }, 70);
    return;
  }
  if(h.kind === 'photo'){ go('photoOld'); scrollLater(h.path.split('#')[1]); return; }
  if(h.kind === 'music'){ go(h.page || 'music2007'); scrollLater(h.path.split('#')[1]); return; }
  if(h.kind === 'log'){ go('log'); return; }
  if(h.kind === 'friend'){ go('friendsOld'); return; }
  if(h.kind === 'dl'){ go('download'); return; }
  go('home');
}

/* ---------------- 调试面板 ---------------- */
function renderDebug(){
  const d = document.getElementById('dbg');
  if(!d) return;
  while(d.children.length > 1) d.removeChild(d.lastChild);
  const id = render.pageId || '?';
  const pg = PAGES[id] || {};
  d.appendChild(sect('当前页面', [
    'id: ' + id,
    'title: ' + (pg.title || '?'),
    'kind: ' + (pg.kind || '?') + '   era: ' + (pg.era || '?'),
    'path: ' + currentPathOf(id),
    'hash: ' + location.hash
  ]));
  d.appendChild(sect('状态', [
    '翻过页面: ' + State.count(),
    '本次会话次数: ' + State.visitCount,
    '首次: ' + State.firstSeen,
    '搜过: ' + (State.searches.join(' / ') || '（无）'),
    '自己输入的路径: ' + (State.foundRoutes.join(' ') || '（无）')
  ]));
  d.appendChild(sect('已解锁 / 线索', Object.keys(State.flags).map(function(k){
    return k + ': ' + State.flags[k];
  })));
  d.appendChild(sect('已访问页面', Object.keys(State.visited).sort().join(' ')));
  d.appendChild(sect('索引条目', [String(SEARCH_INDEX.length) + ' 条']));
  d.appendChild(sect('跳转历史', State.historyLog.slice(-14).map(function(h){ return h.id; })));
  d.appendChild(sect('音频', ['enabled: ' + Audio_.enabled, 'playing: ' + (Audio_.playing || '-')]));
  d.appendChild(sect('错误日志', ERRORS.length ? ERRORS.slice(-8).map(function(e){ return e.m; }) : ['（无）']));
}
function scrollToId(id){
  const el = document.getElementById(id);
  if(el) el.scrollIntoView();
}
function scrollLater(id){ if(id) setTimeout(function(){ scrollToId(id); }, 70); }

function sect(title, lines){
  const box = E('div', null, []);
  box.appendChild(E('h3', null, [title]));
  const pre = E('pre', null, []);
  lines.forEach(function(l){ pre.appendChild(document.createTextNode(l + '\n')); });
  box.appendChild(pre);
  return box;
}

/* ---------------- URL 输入（网络考古的主要动作）---------------- */
/* 用真实 input 而不是 prompt：更像浏览器的地址栏行为，也更好做无障碍 */
function buildOmnibox(){
  const bar = E('div', { id:'omni', class:'small', style:'padding:6px 1px 0' }, []);
  const lab = E('label', { for:'omniinput', class:'dim' }, ['地址：']);
  const inp = E('input', {
    type:'text', id:'omniinput', 'aria-label':'输入网址路径',
    placeholder:'#/' + currentPathOf('home').replace(/^\//,''),
    style:'font-family:Consolas,monospace;font-size:.95em;width:52%;max-width:300px;' +
          'border:1px solid var(--line);background:#fff;color:#000;padding:2px 5px'
  });
  const btn = E('button', { class:'btn', style:'margin-left:5px' }, ['前往']);
  function run(){
    const v = inp.value.trim();
    if(!v) return;
    go(v, null, true);       /* isUserTyped=true → 记进"自己走到过的" */
    inp.value = '';
  }
  btn.addEventListener('click', run);
  inp.addEventListener('keydown', function(ev){ if(ev.key === 'Enter') run(); });
  bar.appendChild(lab); bar.appendChild(inp); bar.appendChild(btn);
  const crumb = document.getElementById('crumb');
  crumb.parentNode.insertBefore(bar, crumb);
}

/* ---------------- 启动 ---------------- */
function boot(){
  buildChrome();
  buildOmnibox();
  window.addEventListener('hashchange', render);
  applyUI();

  /* 首次打开：显示首页 2007，并记一次访问 */
  if(!location.hash && !new URLSearchParams(location.search).get('p')){
    location.replace(location.pathname + '#/home');
  }
  render();

  /* 键盘：按 / 聚焦搜索，Esc 关闭面板 */
  document.addEventListener('keydown', function(ev){
    if(ev.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){
      ev.preventDefault(); toggleSearch();
    }
    if(ev.key === 'Escape'){ togglePanel(false); closeViewer(); }
  });

  /* 声音只在玩家点了开关或点了播放之后才会响 —— 绝不自动播放 */
  document.addEventListener('click', function once(){
    Audio_.init();
    document.removeEventListener('click', once);
  });
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
</script>
